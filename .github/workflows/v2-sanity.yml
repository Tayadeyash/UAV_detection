name: UAV V2 sanity
on:
  pull_request:
    paths:
      - 'src/**'
      - 'train_v2.py'
      - 'evaluate_v2.py'
      - 'requirements-v2.txt'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q src train_v2.py evaluate_v2.py
